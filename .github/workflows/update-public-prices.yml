name: Update TeeScanner prices

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect-teescanner.mjs"
      - ".github/workflows/update-public-prices.yml"

permissions:
  contents: write

concurrency:
  group: teescanner-price-update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install browser collector
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Collect TeeScanner exact course-date prices
        run: npm run collect_teescanner
      - name: Commit verified prices
        run: |
          if git diff --quiet -- public/public-prices.js; then
            echo "No verified TeeScanner price changes"
            exit 0
          fi
          git config user.name "greenfee-price-bot"
          git config user.email "greenfee-price-bot@users.noreply.github.com"
          git add public/public-prices.js
          git commit -m "Update verified TeeScanner prices"
          git push
