name: Update public golf prices

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect-public-prices.mjs"
      - ".github/workflows/update-public-prices.yml"

permissions:
  contents: write

concurrency:
  group: public-price-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public prices
        run: node scripts/collect-public-prices.mjs
      - name: Commit verified updates
        run: |
          if git diff --quiet -- public/public-prices.js; then
            echo "No verified price changes"
            exit 0
          fi
          git config user.name "greenfee-price-bot"
          git config user.email "greenfee-price-bot@users.noreply.github.com"
          git add public/public-prices.js
          git commit -m "Update public golf prices"
          git push
